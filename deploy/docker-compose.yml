# 用法（在 deploy 目录下）：
#   cp .env.example .env && cp config/envs.example.json config/envs.json && cp config/tokens.example.json config/tokens.json
#   docker compose up -d --build                 # 仅日志查询
#   ELK_IMAGE_TARGET=code docker compose up -d --build   # 含源码分析 + GitLab 仓库定时同步 + 服务端 GitNexus
#   docker compose --profile tls up -d --build   # 同时启动 Caddy 自动 HTTPS（需公网域名，见 Caddyfile）
services:
  elk-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: ${ELK_IMAGE_TARGET:-base}
    image: elk-mcp:${ELK_IMAGE_TARGET:-base}
    restart: unless-stopped
    env_file: .env
    ports:
      # 默认只监听本机，由反向代理对外；内网直连可改为 "8765:8765"
      - "${ELK_HTTP_PUBLISH:-127.0.0.1:8765}:8765"
    # 容器不继承宿主机 /etc/hosts：若服务器靠 hosts 解析 Kibana 域名，在这里补上
    # extra_hosts:
    #   - "kibana-test.example.com:10.0.0.10"
    #   - "kibana.example.com:10.0.0.10"
    volumes:
      - ./config:/config:ro          # envs.json / tokens.json，挂目录而非单文件，tokens 修改后自动生效
      - elk-data:/data               # 调用日志、worktree、GitNexus 索引与登记表（GITNEXUS_HOME=/data/gitnexus）
      - elk-repos:/repos             # GitLab 同步下来的仓库（部分 clone）；想放到指定磁盘可改为 /srv/repos:/repos
      # 不用 GitLab 令牌、改用 SSH 拉取已有仓库时，挂载只读 deploy key：
      # - ~/.ssh/elk_deploy_key:/home/elk/.ssh/id_ed25519:ro
      # - ~/.ssh/known_hosts:/home/elk/.ssh/known_hosts:ro

  caddy:
    profiles: ["tls"]
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [elk-mcp]

volumes:
  elk-data:
  elk-repos:
  caddy-data:
